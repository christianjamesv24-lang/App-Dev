<Directory /var/www/html>
    Options -Indexes
</Directory>

<Directory /var/www/html/database>
    Require all denied
</Directory>

<Directory /var/www/html/scripts>
    Require all denied
</Directory>

<Directory /var/www/html/includes>
    Require all denied
</Directory>

<Directory /var/www/html/vendor>
    Require all denied
</Directory>

<Directory /var/www/html/.vscode>
    Require all denied
</Directory>

<Directory /var/www/html/uploads>
    Options -Indexes
    <FilesMatch "\.(php[0-9]?|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>

<LocationMatch "^/uploads/.*\.(?:php[0-9]?|phtml|phar)$">
    Require all denied
</LocationMatch>

<Files "config.php">
    Require all denied
</Files>

<FilesMatch "^(?:\.env(?:\..*)?|\.git.*|composer\.(?:json|lock)|.*\.(?:sql|log|ps1|sh|bak|old|tmp|conf)|Dockerfile|render\.yaml)$">
    Require all denied
</FilesMatch>
